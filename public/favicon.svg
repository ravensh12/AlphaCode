<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AlphaCode">
  <title>AlphaCode</title>
  <!-- Neo-brutalist brand mark: offset ink shadow, violet tile, terminal prompt.
       Matches .brand-mark / .loader-mark (primary #6d4afe on ink #1a1730).
       Strokes are deliberately heavier than the full-size logo so the prompt
       still reads at 16x16. -->
  <rect x="5" y="5" width="57" height="57" rx="14" fill="#1a1730" />
  <rect
    x="2"
    y="2"
    width="57"
    height="57"
    rx="14"
    fill="#6d4afe"
    stroke="#1a1730"
    stroke-width="3"
  />
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 17.5 L25.5 30 L11 42.5" stroke-width="7.5" />
    <path d="M32 43 L50.5 43" stroke-width="7" />
  </g>
</svg>
